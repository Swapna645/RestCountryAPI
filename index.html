<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>REST Countries</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background:#c7e4f188;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .card {
            background: rgb(128, 120, 120);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        button {
            margin-top: 10px;
            padding: 6px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">💢Country Details based on flag💢</h2>

<div class="container" id="countryContainer"></div>

<script src="script.js"></script>
</body>
</html>
